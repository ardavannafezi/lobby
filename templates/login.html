<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lobby — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center">
  <form method="post" action="/login" class="bg-slate-800 p-8 rounded-2xl shadow-xl w-80 space-y-4">
    <h1 class="text-slate-100 text-xl font-semibold text-center">Lobby</h1>
    {% if error %}
      <p class="text-red-400 text-sm text-center">{{ error }}</p>
    {% endif %}
    <input name="username" placeholder="Username" autofocus
           class="w-full rounded-lg bg-slate-700 text-slate-100 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
    <input name="password" type="password" placeholder="Password"
           class="w-full rounded-lg bg-slate-700 text-slate-100 px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
    <button type="submit"
            class="w-full rounded-lg bg-indigo-600 text-white py-2 font-medium hover:bg-indigo-500">
      Sign in
    </button>
  </form>
</body>
</html>
